<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>ToolNova — Free Online Tools, Simple, Fast &amp; Private</title>
    <meta
      name="description"
      content="Useful online tools for text, images, developers, calculations, PDFs, QR codes and everyday tasks."
    />
    <meta name="robots" content="index, follow" />
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#4f46e5" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="manifest" href="manifest.webmanifest" />
    <script>
      (function () {
        try {
          var raw = localStorage.getItem('toolnova:theme');
          var mode = raw ? JSON.parse(raw) : 'system';
          var isDark =
            mode === 'dark' ||
            (mode === 'system' &&
              window.matchMedia &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
        } catch (e) {
          /* localStorage unavailable — default theme applies */
        }
      })();
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
