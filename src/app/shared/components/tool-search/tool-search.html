@if (isOpen()) {
  <div class="search-overlay" (click)="close()">
    <div class="search-panel card" (click)="$event.stopPropagation()" role="dialog" aria-modal="true" aria-label="Search tools">
      <input
        #searchInput
        type="text"
        class="search-input"
        placeholder="Search tools..."
        [value]="query()"
        (input)="onQueryChange($any($event.target).value)"
        (keydown)="onKeydown($event)"
        autocomplete="off"
      />
      <div class="search-results">
        @if (query() && results().length === 0) {
          <p class="search-empty">No tools found for "{{ query() }}"</p>
        }
        @for (tool of results(); track tool.slug; let i = $index) {
          <button
            type="button"
            class="search-result"
            [class.active]="i === activeIndex()"
            (click)="selectTool(tool)"
          >
            <span class="result-name">{{ tool.name }}</span>
            <span class="result-category">{{ tool.category }}</span>
          </button>
        }
      </div>
      <div class="search-footer">
        <span><kbd>↑</kbd><kbd>↓</kbd> navigate</span>
        <span><kbd>Enter</kbd> open</span>
        <span><kbd>Esc</kbd> close</span>
      </div>
    </div>
  </div>
}
