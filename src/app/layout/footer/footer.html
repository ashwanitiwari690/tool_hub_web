<footer class="site-footer">
  <div class="container footer-grid">
    <div class="footer-brand">
      <p class="brand-name">{{ siteConfig.name }}</p>
      <p class="brand-tagline">{{ siteConfig.tagline }}</p>
    </div>

    <div class="footer-col">
      <h4>Tools</h4>
      @for (category of categories; track category.slug) {
        <a [routerLink]="category.route">{{ category.name }}</a>
      }
    </div>

    <div class="footer-col">
      <h4>Resources</h4>
      <a routerLink="/guides">Guides</a>
    </div>

    <div class="footer-col">
      <h4>Company</h4>
      <a routerLink="/about">About</a>
      <a routerLink="/contact">Contact</a>
    </div>

    <div class="footer-col">
      <h4>Legal</h4>
      <a routerLink="/privacy-policy">Privacy Policy</a>
      <a routerLink="/terms">Terms</a>
      <a routerLink="/disclaimer">Disclaimer</a>
      <a routerLink="/cookie-policy">Cookie Policy</a>
    </div>
  </div>

  <div class="container footer-bottom">
    <p>&copy; {{ year }} {{ siteConfig.name }}. All rights reserved.</p>
  </div>
</footer>
